<svg xmlns="http://www.w3.org/2000/svg" width="320" height="660" viewBox="0 0 320 660" role="img">
  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="660" rx="34"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="2" y="2" width="316" height="656" rx="34" fill="#0b1220" stroke="#2a3550" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="320" height="660" fill="#0b1220"/>
    <!-- status bar -->
    <text x="26" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e7eefc" font-weight="700">9:41</text>
    <g transform="translate(250,20)" fill="#e7eefc">
      <rect x="0" y="2" width="16" height="9" rx="2"/><rect x="20" y="2" width="16" height="9" rx="2"/>
      <rect x="40" y="0" width="22" height="11" rx="3" fill="none" stroke="#e7eefc" stroke-width="1.2"/>
      <rect x="42" y="2" width="15" height="7" rx="1.5"/><rect x="63" y="3.5" width="2" height="4" rx="1"/>
    </g>
    <text x="160" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#e7eefc" font-weight="700" text-anchor="middle">Journey</text><line x1="0" y1="80" x2="320" y2="80" stroke="#1b2435" stroke-width="1"/>
    <rect x="20" y="120" width="134" height="78" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="87" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#e7eefc" font-weight="800" text-anchor="middle">12.4</text><text x="87" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="middle">km</text><rect x="166" y="120" width="134" height="78" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="233" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" fill="#e7eefc" font-weight="800" text-anchor="middle">18:32</text><text x="233" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="middle">Time</text><circle cx="160" cy="330" r="78" fill="none"/><circle cx="160" cy="330" r="78" fill="#16223a" stroke="#4f8cff" stroke-width="2"/><circle cx="160" cy="330" r="96" fill="none" stroke="#4f8cff" stroke-width="1" opacity="0.25"/><text x="160" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e7eefc" font-weight="700" text-anchor="middle">Recording</text><rect x="20" y="452" width="280" height="52" rx="14" fill="#e5484d"/><text x="160" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="800" text-anchor="middle">End drive</text><text x="160" y="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5a6b8c" font-weight="400" text-anchor="middle">Tracking uses foreground GPS.</text><text x="160" y="544" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5a6b8c" font-weight="400" text-anchor="middle">Keep the screen on while driving.</text>
    <!-- home indicator -->
    <rect x="105" y="646" width="110" height="5" rx="2.5" fill="#2a3550"/>
  </g>
</svg>