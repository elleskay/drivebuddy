amily="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle">Avg / trip</text><rect x="117" y="172" width="86" height="56" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="160" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#e7eefc" font-weight="800" text-anchor="middle">Fri</text><text x="160" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle">Busiest day</text><rect x="214" y="172" width="86" height="56" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="257" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#e7eefc" font-weight="800" text-anchor="middle">6pm</text><text x="257" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#9fb0d0" font-weight="400" text-anchor="middle">Peak hour</text><text x="24" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="700" text-anchor="start">RECOMMENDATIONS</text><rect x="20" y="260" width="280" height="86" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="36" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e7eefc" font-weight="400" text-anchor="start">💳</text><text x="64" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e7eefc" font-weight="700" text-anchor="start">Beat the ERP peak</text><text x="64" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="