<svg xmlns="http://www.w3.org/2000/svg" width="320" height="660" viewBox="0 0 320 660" role="img">
  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="320" height="660" rx="34"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="2" y="2" width="316" height="656" rx="34" fill="#0b1220" stroke="#2a3550" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="320" height="660" fill="#0b1220"/>
    <!-- status bar -->
    <text x="26" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e7eefc" font-weight="700">9:41</text>
    <g transform="translate(250,20)" fill="#e7eefc">
      <rect x="0" y="2" width="16" height="9" rx="2"/><rect x="20" y="2" width="16" height="9" rx="2"/>
      <rect x="40" y="0" width="22" height="11" rx="3" fill="none" stroke="#e7eefc" stroke-width="1.2"/>
      <rect x="42" y="2" width="15" height="7" rx="1.5"/><rect x="63" y="3.5" width="2" height="4" rx="1"/>
    </g>
    <text x="160" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#e7eefc" font-weight="700" text-anchor="middle">AI Assistant</text><line x1="0" y1="80" x2="320" y2="80" stroke="#1b2435" stroke-width="1"/>
    <rect x="20" y="96" width="232" height="70" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="34" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">Hi! I'm DriveBuddy. Ask me about</text><text x="34" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">ERP, traffic, parking, fuel, or</text><text x="34" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">anything driving in Singapore.</text><rect x="120" y="176" width="180" height="54" rx="14" fill="#4f8cff" stroke="#4f8cff" stroke-width="1"/><text x="134" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">How much is ERP at the</text><text x="134" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">CTE this morning?</text><rect x="20" y="238" width="232" height="86" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="34" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">ERP on the CTE during morning</text><text x="34" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">peak is typically $2–$3 per</text><text x="34" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">gantry. Leave before 7:30am to</text><text x="34" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e7eefc" font-weight="400" text-anchor="start">avoid the highest charges. 🚗</text><rect x="120" y="330" width="180" height="38" rx="14" fill="#4f8cff" stroke="#4f8cff" stroke-width="1"/><text x="134" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">🎤 (voice message)</text><line x1="0" y1="596" x2="320" y2="596" stroke="#1b2435"/><circle cx="42" cy="622" r="22" fill="#e5484d"/><text x="42" y="628" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="400" text-anchor="middle">⏹</text><rect x="70" y="600" width="150" height="44" rx="22" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="86" y="627" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5a6b8c" font-weight="400" text-anchor="start">Ask DriveBuddy…</text><rect x="228" y="600" width="72" height="44" rx="22" fill="#4f8cff"/><text x="264" y="627" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle">Send</text>
    <!-- home indicator -->
    <rect x="105" y="646" width="110" height="5" rx="2.5" fill="#2a3550"/>
  </g>
</svg>