    <text x="24" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="700" text-anchor="start">NOTIFICATION TYPES</text><rect x="20" y="114" width="280" height="184" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="36" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">Pre-drive alerts</text><text x="36" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="start">Reminders before you set off</text><rect x="244" y="130" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="141" r="8" fill="#e7eefc"/><line x1="36" y1="172" x2="284" y2="172" stroke="#243049"/><text x="36" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">Real-time alerts</text><text x="36" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="start">Live warnings while driving</text><rect x="244" y="176" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="187" r="8" fill="#e7eefc"/><line x1="36" y1="218" x2="284" y2="218" stroke="#243049"/><text x="36" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">Post-trip summaries</text><text x="36" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="start">Cost &amp; distance after each drive</text><rect x="244" y="222" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="233" r="8" fill="#e7eefc"/><line x1="36" y1="264" x2="284" y2="264" stroke="#243049"/><text x="36" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">System</text><text x="36" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="400" text-anchor="start">App news &amp; account notices</text><rect x="244" y="268" width="40" height="22" rx="11" fill="#243049"/><circle cx="255" cy="279" r="8" fill="#e7eefc"/><text x="24" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" font-weight="700" text-anchor="start">REAL-TIME ALERT CHANNELS</text><rect x="20" y="324" width="280" height="232" rx="14" fill="#131c2e" stroke="#243049" stroke-width="1"/><text x="36" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">🚀 Speed warnings</text><rect x="244" y="342" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="353" r="8" fill="#e7eefc"/><line x1="36" y1="370" x2="284" y2="370" stroke="#243049"/><text x="36" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">⚠️ Road hazards</text><rect x="244" y="386" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="397" r="8" fill="#e7eefc"/><line x1="36" y1="414" x2="284" y2="414" stroke="#243049"/><text x="36" y="442" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">💳 ERP charges</text><rect x="244" y="430" width="40" height="22" rx="11" fill="#243049"/><circle cx="255" cy="441" r="8" fill="#e7eefc"/><line x1="36" y1="458" x2="284" y2="458" stroke="#243049"/><text x="36" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">🚧 Traffic incidents</text><rect x="244" y="474" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="485" r="8" fill="#e7eefc"/><line x1="36" y1="502" x2="284" y2="502" stroke="#243049"/><text x="36" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e7eefc" font-weight="600" text-anchor="start">🌧️ Weather</text><rect x="244" y="518" width="40" height="22" rx="11" fill="#4f8cff"/><circle cx="273" cy="529" r="8" fill="#e7eefc"/>
    <!-- home indicator -->
    <rect x="105" y="646" width="110" height="5" rx="2.5" fill="#2a3550"/>
