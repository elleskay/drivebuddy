name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  commitlint:
    name: Commitlint (PR commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Typecheck (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test (API unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  app-check:
    name: Expo app (doctor + web export)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: expo-doctor (advisory)
        # Advisory only: expo-doctor checks against the live npm registry, so it
        # can start failing with no change in this repo.
        working-directory: apps/drivebuddy
        run: npx --yes expo-doctor@latest || true
      - name: Expo web export (proves the Pages demo still builds)
        working-directory: apps/drivebuddy
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
        run: npx expo export --platform web

  api-build:
    name: Build API (NestJS)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Nest build
        working-directory: services/api
        run: npm run build

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: api-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install CDK package deps
        working-directory: infra/cdk/drivebuddy
        run: npm ci
      - name: cdk synth
        working-directory: infra/cdk/drivebuddy
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: ap-southeast-1
          DATABASE_URL: postgres://placeholder
          JWT_SECRET: placeholder
        run: npx cdk synth

  spec-test:
    name: spec-test (build + gate self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build @platform/spec-test (dual ESM + CJS)
        working-directory: packages/spec-test
        run: npm run build
      - name: Validate sample spec
        working-directory: packages/spec-test
        run: node dist/cli.js --spec samples/example.spec.yml --coverage samples/results-full.jsonl --out /tmp/sample-report.md
      - name: Gate fails on partial coverage (expected exit 1)
        working-directory: packages/spec-test
        run: |
          set +e
          node dist/cli.js --spec samples/example.spec.yml --coverage samples/results.jsonl --out /tmp/partial.md
          rc=$?
          set -e
          if [ "$rc" != "1" ]; then
            echo "expected exit 1 from partial coverage, got $rc"
            exit 1
          fi
          echo "gate correctly exits 1 on partial coverage"
      - name: Native gate passes with fresh, stamped artifacts (expected exit 0)
        working-directory: packages/spec-test
        run: node dist/cli.js --spec samples/native.spec.yml --coverage samples/native-results.jsonl --verification-dir samples/verification --app-version 1.4.0 --now 2026-05-25 --out /tmp/native.md
      - name: Native gate fails when the app moved (expected exit 1)
        working-directory: packages/spec-test
        run: |
          set +e
          node dist/cli.js --spec samples/native.spec.yml --coverage samples/native-results.jsonl --verification-dir samples/verification --app-version 1.5.0 --now 2026-05-25 --out /tmp/native-stale.md
          rc=$?
          set -e
          if [ "$rc" != "1" ]; then
            echo "expected exit 1 from app-version staleness, got $rc"
            exit 1
          fi
          echo "native gate correctly exits 1 when the app version moved"

  attestations:
    name: Native artifact attestations (layer B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history to find the commit that last touched each artifact
      - name: Verify signed-commit attestations
        # Skips while apps/drivebuddy/verification is empty; enforces and fails
        # closed once verification artifacts land with an allowed-signers list.
        run: bash scripts/verify-attestations.sh apps/drivebuddy/verification
      - name: Guard self-test (signed artifacts + empty allow-list must exit 2)
        run: |
          set +e
          bash scripts/verify-attestations.sh packages/spec-test/samples/verification
          rc=$?
          set -e
          if [ "$rc" != "2" ]; then
            echo "expected exit 2 (accountability cannot be opt-in), got $rc"
            exit 1
          fi
          echo "guard correctly exits 2 when signed artifacts have no allow-list"
